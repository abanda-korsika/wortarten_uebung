<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wortarten Lernplattform</title><style>body{font-family:Arial,sans-serif;background:#eef2f7;margin:0}header{background:#2c3e50;color:white;padding:20px;text-align:center}.container{max-width:900px;margin:20px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}#word{font-size:2.2rem;text-align:center;color:#1565c0;margin:25px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}button{padding:14px;border:none;border-radius:8px;background:#1976d2;color:white;font-size:1rem;cursor:pointer}button:hover{background:#125aa0}.progress{margin:15px 0}.bar{height:18px;background:#ddd;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#4caf50}#feedback{text-align:center;font-weight:bold;margin:15px}#stats{text-align:center}</style></head><body><header><h1>Wortarten Lernplattform</h1><p>Nomen, Verben, Adjektive, Pronomen und Präpositionen erkennen</p></header><div class="container"><div id="screen"><h2>Start</h2><p>Trainiere die Bestimmung von Wortarten.</p><button onclick="startQuiz()">Übung starten</button></div></div><script>const data=[{w:'Hund',a:'Nomen'},{w:'laufen',a:'Verb'},{w:'schön',a:'Adjektiv'},{w:'ich',a:'Pronomen'},{w:'unter',a:'Präposition'},{w:'Baum',a:'Nomen'},{w:'denken',a:'Verb'},{w:'schnell',a:'Adjektiv'},{w:'wir',a:'Pronomen'},{w:'neben',a:'Präposition'},{w:'Schule',a:'Nomen'},{w:'springen',a:'Verb'}];let q=[],i=0,p=0;function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}function startQuiz(){q=shuffle(data).slice(0,10);i=0;p=0;render()}function render(){let percent=(i/q.length)*100;document.getElementById('screen').innerHTML=`<div class='progress'><div class='bar'><div class='fill' style='width:${percent}%'></div></div></div><div id='stats'>Aufgabe ${i+1} von ${q.length} | Punkte: ${p}</div><div id='word'>${q[i].w}</div><div class='choices'><button onclick="check('Nomen')">Nomen</button><button onclick="check('Verb')">Verb</button><button onclick="check('Adjektiv')">Adjektiv</button><button onclick="check('Pronomen')">Pronomen</button><button onclick="check('Präposition')">Präposition</button></div><div id='feedback'></div>`}function check(ans){const ok=q[i].a;if(ans===ok){p++;document.getElementById('feedback').innerHTML='✅ Richtig!'}else{document.getElementById('feedback').innerHTML='❌ Richtig wäre: '+ok;}setTimeout(()=>{i++;if(i<q.length){render()}else{endGame()}},900)}function endGame(){const note=Math.round((p/q.length)*100);document.getElementById('screen').innerHTML=`<h2>Auswertung</h2><p>Du hast <strong>${p}</strong> von <strong>${q.length}</strong> Punkten erreicht.</p><p>Erfolgsquote: ${note}%</p><button onclick='startQuiz()'>Nochmal üben</button>`}</script></body></html>
